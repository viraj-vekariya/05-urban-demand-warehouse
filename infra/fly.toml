# fly deploy --config infra/fly.toml --dockerfile infra/Dockerfile
app = "urban-demand-warehouse"
primary_region = "ewr"          # the data is New York; keep the app near its readers

[build]
  dockerfile = "Dockerfile"
  [build.args]
    MONTHS = "3"

[env]
  URBAN_DB = "/app/data/urban.duckdb"

[http_service]
  internal_port = 8500
  force_https = true
  # Scale to zero is fine: the warehouse is baked in and DuckDB opens in milliseconds,
  # so a cold start is a process start. The allocation cache rebuilds on first request
  # in well under a second.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "20s"
    timeout = "4s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 39,033 cells held in memory for the live allocation, plus DuckDB's buffer pool.
  memory_mb = 1024
